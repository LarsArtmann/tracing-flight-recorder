[package]
name = "tracing-flight-recorder"
version = "0.3.0"
edition = "2021"
rust-version = "1.86"
authors = ["Lars Artmann <lars@larsartmann.com>"]
license = "Apache-2.0"
description = "In-memory ring-buffer flight recorder for tracing events. Inspired by Go 1.25's trace.FlightRecorder — continuously buffers DEBUG/TRACE events, snapshots on failure."
repository = "https://github.com/LarsArtmann/tracing-flight-recorder"
homepage = "https://github.com/LarsArtmann/tracing-flight-recorder"
documentation = "https://docs.rs/tracing-flight-recorder"
readme = "README.md"
keywords = ["tracing", "flight-recorder", "diagnostics", "ring-buffer", "debugging"]
categories = ["development-tools::debugging", "development-tools::profiling"]
exclude = ["/target", "/.github", "/docs/status", "/docs/planning", "/docs/RELEASE.md", "/AGENTS.md", "/CONTRIBUTING.md", "/TODO_LIST.md", "/FEATURES.md", "/ROADMAP.md", "/release.toml"]

# Build docs.rs with the `openapi` feature so `CapturedEvent`'s `ToSchema`
# derive appears on the published docs page. Without this, docs.rs builds
# with `default = []` and the OpenAPI schema (the feature users would want
# to see) is invisible.
[package.metadata.docs.rs]
features = ["openapi", "gzip"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Enables `utoipa::ToSchema` derive on `CapturedEvent` for OpenAPI documentation.
openapi = ["dep:utoipa"]
# Enables gzip-compressed dump output (`dump_to_file_gz`, `dump_envelope_to_file_gz`).
gzip = ["dep:flate2"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# `rc_schema` makes `utoipa::ToSchema` treat `Arc<T>` transparently (uses T's
# schema). Paired with serde's `rc` feature above, `SpanContext.fields` can be
# `Arc<Vec<…>>` for O(1) clone-per-event without breaking OpenAPI generation.
utoipa = { version = "5", optional = true, features = ["chrono", "rc_schema"] }
# Optional gzip compression for dump output, enabled by the `gzip` feature.
flate2 = { version = "1.0", optional = true }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[lints.rust]
# `docsrs` is set only by docs.rs (via rustdoc-args above) to enable
# `doc(cfg(...))` feature-gate badges on the published docs page.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dev-dependencies]
proptest = "1.11.0"
criterion = "0.5"

# Benchmarks run with their own (`harness = false`) entry point so criterion
# can own `main`. Invoke with `cargo bench`.
[[bench]]
name = "push_dump"
harness = false
